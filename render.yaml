services:
  - type: web
    name: omniresearch-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: omniresearch-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OMNI_MODEL
        value: openai/gpt-oss-120b

databases:
  - name: omniresearch-postgres
    databaseName: omniresearch
    user: omni_user
    plan: free
